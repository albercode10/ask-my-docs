# Fails on unformatted Java (Spotless), ESLint errors and unformatted frontend
# files (Prettier), on every push and pull request. Locally:
#   backend/   ./mvnw spotless:apply        (fix)  ./mvnw spotless:check
#   frontend/  npm run format               (fix)  npm run lint && npm run format:check
# Tool versions come from .sdkmanrc and frontend/.nvmrc. The checks' behavior is
# tested by scripts/test-code-style.sh, which runs here too. Build and tests run in
# build.yml. See docs/plans/ALB-26.md.
name: code-style

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: code style
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version-file: .sdkmanrc # Temurin, from the -tem suffix
          cache: maven
          cache-dependency-path: backend/pom.xml
          # Same key as build.yml's backend job, which saves the full dependency
          # set; a Spotless-only save here would block it.
          cache-read-only: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Every check below runs even when an earlier one fails, so every problem shows.
      # Spotless needs no npm install, so it comes first and runs even if npm ci fails.
      - name: Spotless (Java)
        working-directory: backend
        run: ./mvnw -B -ntp spotless:check

      - name: Install frontend dependencies
        id: npm-ci
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm ci

      - name: ESLint
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        working-directory: frontend
        run: npm run lint

      - name: Prettier
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        working-directory: frontend
        run: npm run format:check

      - name: Test code style tooling
        if: ${{ !cancelled() && steps.npm-ci.outcome == 'success' }}
        run: sh scripts/test-code-style.sh
