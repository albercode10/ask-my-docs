# Test-only overrides, loaded on top of src/main/resources/application.properties
# (classpath:/config/ wins over classpath:/, and both files are read).

# No warm-up call to the (mocked) model at startup. ChatWarmUpTests turn it back on.
app.chat.warm-up=false

# Tests never read the real book in data/books/. Tests that need a book point this at a generated fixture EPUB.
app.book.path=target/no-book-in-tests.epub
