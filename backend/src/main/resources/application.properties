spring.application.name=backend

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:8b
# API docs (springdoc): off by default, so a packaged jar doesn't publish them.
# The dev profile (application-dev.properties), which ./mvnw spring-boot:run activates, turns them on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# /swagger-ui.html is the default; set here so the documented URL stays put.
springdoc.swagger-ui.path=/swagger-ui.html
