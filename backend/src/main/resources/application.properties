spring.application.name=backend

# No authentication yet: listen on localhost only, so other machines on the network can't use the local model
# or pull the copyrighted book through /chat. This doesn't stop a web page in your own browser that points its
# domain at 127.0.0.1 (DNS rebinding); config/LocalhostOnlyFilter rejects those by their Host header.
server.address=127.0.0.1

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:8b
# A prompt holds the instructions, at most app.retrieval.top-k passages of ~400 tokens and the question (~4k tokens
# with the answer). Ollama's default context (2048) would silently cut it off; 8k leaves room and costs far less
# memory than the 32k the whole book needed.
spring.ai.ollama.chat.num-ctx=8192
# qwen3 reasons in <think> blocks by default. Answers shouldn't include them.
spring.ai.ollama.chat.think=false
# Unloading the model drops Ollama's prompt cache, and reloading it takes seconds. Default 5m.
spring.ai.ollama.chat.keep-alive=30m
# Caps an answer at ~1k tokens, so one question can't keep the model generating for minutes.
spring.ai.ollama.chat.num-predict=1024
# A failed model call answers 503 within seconds. Spring AI's default (10 attempts, backoff up to 3 min) would hold
# the request about 22 minutes when Ollama is down.
spring.ai.retry.max-attempts=1
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=2s
# Embeddings for the book's chunks (at startup) and for each question (ALB-32). Spring AI's default is
# mxbai-embed-large. Pull it once: ollama pull nomic-embed-text
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.embedding.keep-alive=30m
# SimpleVectorStore logs every chunk it embeds at INFO; BookIndex logs one summary line instead.
logging.level.org.springframework.ai.vectorstore.SimpleVectorStore=warn

# The book (ALB-30). Copyrighted: never committed, lives in the git-ignored data/books/ at the repo root.
# Relative to the working directory, which is backend/ for ./mvnw spring-boot:run. See README → The book.
app.book.path=../data/books/beard-and-moustache-management.epub
# Retrieval (ALB-32): the book is split into chunks of ~chunk-size tokens, embedded at startup and kept in memory.
# Each question gets at most top-k chunks whose cosine similarity is at least similarity-threshold. Starting values,
# checked by hand (docs/plans/ALB-32.md); tuning is ALB-17. Set logging.level.com.alber.backend.book=debug to log
# each search's chunk indexes and scores.
app.retrieval.chunk-size=400
app.retrieval.top-k=4
app.retrieval.similarity-threshold=0.6
# Load the chat model in Ollama once at startup, in the background, so the first question doesn't wait for it.
app.chat.warm-up=true
# Time limit for a whole streamed answer (POST /chat/stream); past it the stream ends with an error event. Spring MVC
# sets no timeout on streamed responses, so this is the only one. A full-length answer takes about a minute.
app.chat.stream-timeout=5m

# Error responses as RFC 9457 problem details (application/problem+json), e.g. a blank question.
spring.mvc.problemdetails.enabled=true
# API docs (springdoc): off by default, so a packaged jar doesn't publish them.
# The dev profile (application-dev.properties), which ./mvnw spring-boot:run activates, turns them on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# /swagger-ui.html is the default; set here so the documented URL stays put.
springdoc.swagger-ui.path=/swagger-ui.html
