# Scans the full git history (all branches and tags, merge commits included) for
# secrets on every push and pull request, and fails the run when gitleaks finds a leak.
# The scan itself is scripts/gitleaks-scan-history.sh, tested by
# scripts/test-gitleaks-hook.sh. Local counterpart: .githooks/pre-commit.
#
# Runs the gitleaks CLI directly rather than gitleaks-action: on push and PR
# that action only scans the event's commits with --first-parent, so secrets on
# merged side branches get through. See docs/plans/ALB-28.md.
name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1 # keep in step with the local gitleaks
      # sha256 of gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz, from the release's checksums.txt
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, all branches and tags
          persist-credentials: false # gitleaks needs no token

      - name: Install gitleaks
        id: install
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan full history
        run: GITLEAKS="$RUNNER_TEMP/gitleaks" sh scripts/gitleaks-scan-history.sh

      # Tests the hook and the scan script above against the same gitleaks.
      # Runs even when the scan finds a leak, so both results show.
      - name: Test hook and scan script
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: PATH="$RUNNER_TEMP:$PATH" sh scripts/test-gitleaks-hook.sh
