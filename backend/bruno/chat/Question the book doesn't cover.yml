info:
  name: Question the book doesn't cover
  type: http
  seq: 2
docs: |-
  No passage of the book scores above app.retrieval.similarity-threshold for this question, so the
  prompt carries none and the model should say that the book doesn't cover it. With
  --logging.level.com.alber.backend.book=debug the backend logs "Retrieved 0 passages: []".
http:
  method: post
  url: "{{baseUrl}}/chat"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "question": "What is the capital of France?"
      }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("answer is not blank", function() {
          expect(res.body.answer).to.be.a("string");
          expect(res.body.answer.trim()).to.not.equal("");
        });
settings:
  timeout: 0
