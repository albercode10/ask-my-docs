spring.application.name=backend

# No authentication yet: listen on localhost only, so other machines on the network can't use the local model
# or pull the copyrighted book through /chat. This doesn't stop a web page in your own browser that points its
# domain at 127.0.0.1 (DNS rebinding); config/LocalhostOnlyFilter rejects those by their Host header.
server.address=127.0.0.1

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:8b
# The whole book (~21k tokens) goes in every prompt. Ollama's default context (2048) would silently cut it off.
# 32k context costs roughly 5 GB of KV cache on top of the model weights.
spring.ai.ollama.chat.num-ctx=32768
# qwen3 reasons in <think> blocks by default. Answers shouldn't include them.
spring.ai.ollama.chat.think=false
# Unloading the model drops Ollama's prompt cache (the processed book). Default 5m.
spring.ai.ollama.chat.keep-alive=30m
# Caps an answer at ~1k tokens, so one question can't keep the model generating for minutes.
spring.ai.ollama.chat.num-predict=1024
# A failed model call answers 503 within seconds. Spring AI's default (10 attempts, backoff up to 3 min) would hold
# the request about 22 minutes when Ollama is down, and resend the whole book on every attempt.
spring.ai.retry.max-attempts=1
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.max-interval=2s

# The book (ALB-30). Copyrighted: never committed, lives in the git-ignored data/books/ at the repo root.
# Relative to the working directory, which is backend/ for ./mvnw spring-boot:run. See README → The book.
app.book.path=../data/books/beard-and-moustache-management.epub
# Process the book in Ollama once at startup, in the background, so the first question is fast.
app.chat.warm-up=true

# Error responses as RFC 9457 problem details (application/problem+json), e.g. a blank question.
spring.mvc.problemdetails.enabled=true
# API docs (springdoc): off by default, so a packaged jar doesn't publish them.
# The dev profile (application-dev.properties), which ./mvnw spring-boot:run activates, turns them on.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# /swagger-ui.html is the default; set here so the documented URL stays put.
springdoc.swagger-ui.path=/swagger-ui.html
