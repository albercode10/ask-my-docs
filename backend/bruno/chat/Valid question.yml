info:
  name: Valid question
  type: http
  seq: 1
docs: |-
  The backend finds the passages of the book closest to the question (at most app.retrieval.top-k,
  scoring at least app.retrieval.similarity-threshold) and sends only those to the model.

  To see which passages a question retrieved, run the backend with
  --logging.level.com.alber.backend.book=debug: each search logs a line such as
  "Retrieved 4 passages: [#46 (0.844), ...]" (chunk index and similarity). A question the book
  answers, like this one, should retrieve at least one.
http:
  method: post
  url: "{{baseUrl}}/chat"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "question": "How do I wax a moustache?"
      }
runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: tests
      code: |-
        test("answer is not blank", function() {
          expect(res.body.answer).to.be.a("string");
          expect(res.body.answer.trim()).to.not.equal("");
        });
        test("answer has no <think> reasoning", function() {
          expect(res.body.answer).to.not.include("<think>");
        });
settings:
  timeout: 0
